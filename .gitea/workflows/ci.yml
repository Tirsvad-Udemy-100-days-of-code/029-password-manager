# Continuous integration for MyPass: install the project and run pytest.
#
# Purpose:  fail a pull request whose tests fail (MIL-001, BC-001 success
#           criterion 2).
# Triggers: push to main, every pull request, and a manual run.
# Inputs:   none. Secrets: none. Changes outside the repository: none.
# Runner:   runs-on: mypass-ci, a label only the project's own runner has, so the
#           job always runs on the pinned image. The instance also has a shared
#           runner (label ubuntu-latest, image docker.gitea.com/runner-images)
#           that is not pinned and is not used. The own runner is
#           act_runner 0.6.1 on Gitea 1.27.3 with the label
#           mypass-ci:docker://mypass-ci-ubuntu:c58e2b364da0, a local tag of
#           catthehacker/ubuntu pinned by the digest in env.RUNNER_IMAGE_DIGEST
#           (Ubuntu 24.04, tag act-latest at 2026-10-13):
#             docker pull catthehacker/ubuntu@<digest>
#             docker tag  catthehacker/ubuntu@<digest> mypass-ci-ubuntu:c58e2b364da0
#           (act_runner 0.6.1 ignores a label that contains @sha256.) Tk and
#           Xvfb are installed at the versions in env so the window tests run
#           under a virtual display. To update: pull the new image, record its
#           digest here, re-register the label and update the two versions.
#           While the own runner is offline, pull requests wait; to use the
#           shared runner instead, change runs-on to ubuntu-latest.
# Tools:    the Python version is set once in env.PYTHON_VERSION; actionlint is
#           downloaded at env.ACTIONLINT_VERSION and checked against
#           env.ACTIONLINT_SHA256 before it is used.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

# A newer run on the same ref makes the older one obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  # The runner image digest (documentation: the label is set on the runner) and the
  # Ubuntu 24.04 package versions installed on it. See the Runner note above.
  RUNNER_IMAGE_DIGEST: "sha256:c58e2b364da03b0c804c7d660f2ecbedf2f221a382b9baa0b344b0144780ff43"
  LIBTK_VERSION: "8.6.14-1build1"
  XVFB_VERSION: "2:21.1.12-1ubuntu1.8"
  # actionlint release (linux_amd64) and the SHA-256 of its archive, from the
  # release's actionlint_1.7.12_checksums.txt; the step fails on a mismatch.
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_RELEASES: "https://github.com/rhysd/actionlint/releases/download"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  test:
    name: Run pytest
    runs-on: mypass-ci
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Tk and a virtual display
        run: |
          if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
          ${SUDO:-} apt-get update -qq
          ${SUDO:-} apt-get install -y -qq --no-install-recommends \
            "libtk8.6=${LIBTK_VERSION}" "xvfb=${XVFB_VERSION}"

      - name: Install the project with test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install actionlint at a pinned version
        run: |
          cd "${RUNNER_TEMP}"; ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${ACTIONLINT_RELEASES}/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          echo "${ACTIONLINT_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" actionlint
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Lint the workflow YAML
        run: python -m yamllint -c .yamllint.yml .gitea .yamllint.yml

      - name: Check the workflow with actionlint
        run: actionlint -config-file .gitea/actionlint.yaml .gitea/workflows/*.yml

      - name: Check formatting, lint and types
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests
          python -m mypy

      - name: Run the tests
        run: xvfb-run -a python -m pytest
