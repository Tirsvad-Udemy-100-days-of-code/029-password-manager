# Continuous integration for MyPass: install the project and run pytest.
#
# Purpose:  fail a pull request whose tests fail (MIL-001, BC-001 success
#           criterion 2).
# Triggers: push to main, every pull request, and a manual run.
# Inputs:   none. Secrets: none. Changes outside the repository: none.
# Runner:   needs a registered runner with the label ubuntu-latest and Python
#           3.13 available to actions/setup-python. Gitea Actions; the same
#           file also runs on GitHub Actions.
# Tools:    the Python version is set once in env.PYTHON_VERSION.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

# A newer run on the same ref makes the older one obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the project with test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint the workflow YAML
        run: python -m yamllint -c .yamllint.yml .gitea .yamllint.yml

      - name: Check formatting, lint and types
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests
          python -m mypy

      - name: Run the tests
        run: python -m pytest
